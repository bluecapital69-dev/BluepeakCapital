<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>BluepeakCapital | Login</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,20 80,40 80,70 50,90 20,70 20,40' fill='%233b82f6'/%3E%3C/svg%3E" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fb 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
            border: 1px solid #eef2f6;
        }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            margin-bottom: 1rem;
        }
        .logo-text { font-size: 1.5rem; font-weight: 700; color: #1a1f36; }
        .logo-text span { color: #3b82f6; }
        h1 { font-size: 1.75rem; font-weight: 600; text-align: center; margin-bottom: 0.5rem; color: #1a1f36; }
        .subtitle { text-align: center; color: #5b677b; margin-bottom: 2rem; font-size: 0.9rem; }
        .input-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.5rem; color: #1e293b; }
        .password-wrapper { position: relative; display: flex; align-items: center; }
        input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: #fff;
            font-family: inherit;
            color: #1a1f36;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .toggle-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            padding: 0;
            color: #64748b;
        }
        .toggle-btn svg { width: 20px; height: 20px; }
        button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            padding: 0.9rem;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.2s;
            font-family: inherit;
        }
        button[type="submit"]:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(59,130,246,0.3); }
        button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error-message {
            background: rgba(239,68,68,0.1);
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(239,68,68,0.2);
            display: none;
        }
        .success-message {
            background: rgba(16,185,129,0.1);
            color: #059669;
            padding: 0.75rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(16,185,129,0.2);
            display: none;
        }
        .footer-links { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #5b677b; }
        .footer-links a { color: #3b82f6; text-decoration: none; font-weight: 500; }
        .footer-links a:hover { text-decoration: underline; }
        @media (max-width: 500px) { .login-card { padding: 1.5rem; margin: 1rem; } }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">⛰️</div>
            <div class="logo-text">Bluepeak<span>Capital</span></div>
        </div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your account</p>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
            <div class="input-group">
                <label>Email address</label>
                <input type="email" id="email" placeholder="john@example.com" required autocomplete="email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="toggle-btn" onclick="togglePassword()">
                        <svg id="togglePasswordIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit">Sign In →</button>
        </form>
        <div class="footer-links">
            <p>Don't have an account? <a href="signup.html">Get started →</a></p>
            <p style="margin-top: 0.8rem;"><a href="index.html">← Back to homepage</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ===== Guard: only init once =====
        if (!window.__supabaseClient) {
            const SUPABASE_URL = 'https://xdwjjfvyowveqcziwssv.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_nd0hfyx5B3XmUaX1nvtu3w_NvZQU5k8';
            window.__supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
        const sb = window.__supabaseClient;

        const loginForm = document.getElementById('loginForm');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');

        window.togglePassword = function () {
            const input = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />';
            }
        };

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                return showError('Please enter your email and password');
            }

            const submitBtn = loginForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Signing in...';
            submitBtn.disabled = true;

            try {
                console.log('[login] signing in:', email);
                const { data, error } = await sb.auth.signInWithPassword({ email, password });
                console.log('[login] response:', { data, error });

                if (error) {
                    if (error.message.toLowerCase().includes('invalid login')) {
                        return showError('Invalid email or password');
                    }
                    if (error.message.toLowerCase().includes('email not confirmed')) {
                        return showError('Please confirm your email before signing in');
                    }
                    return showError(error.message);
                }

                if (data && data.session) {
                    showSuccess('Signed in! Redirecting…');
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
                } else {
                    showError('Login failed — no session returned');
                }
            } catch (err) {
                console.error('[login] threw:', err);
                showError('Network error: ' + (err.message || 'unknown'));
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        // Redirect if already logged in
        sb.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = 'dashboard.html';
        });

        function showError(message) {
            console.error('[login] error:', message);
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        function showSuccess(message) {
            console.log('[login] success:', message);
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
    </script>
</body>
</html>
